name: 🐍 Generate Contribution Snake

on:
  schedule:
    - cron: '0 0 * * 0'  # Runs weekly on Sunday midnight UTC
  workflow_dispatch:      # Allows manual trigger
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    name: generate-snake-animation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Snake SVG from Contribution Graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00D2FF&color_dots=#161b22,#0d3a24,#006d32,#26a641,#00D2FF

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.5.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'Generate Contribution Snake Animation [skip ci]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
